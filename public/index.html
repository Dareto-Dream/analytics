<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#eb6841" />
    <title>DeltaVDevs Analytics</title>
    <link rel="stylesheet" href="https://css.deltavdevs.com/theme.css" />
    <link rel="stylesheet" href="https://css.deltavdevs.com/fonts.css" />
    <link rel="stylesheet" href="/analytics.css" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div id="login" class="login" hidden>
      <div class="card login-card">
        <p class="eyebrow">deltavdevs / analytics</p>
        <h1 class="ultratitle">Analytics</h1>
        <p class="lead">Traffic, sources, uptime and errors for every DeltaVDevs site.</p>
        <p id="login-error" class="notice error" hidden></p>
        <a class="button-link" href="/auth/ward/start"><button class="cta lg" type="button" tabindex="-1">Continue with Ward</button></a>
        <p class="caption">For DeltaVDevs staff (viewer, admin or owner in Ward).</p>
      </div>
    </div>

    <div id="shell" class="shell" hidden>
      <aside class="rail">
        <div class="brand"><span class="brand-mark">Δ</span><span>Analytics</span></div>
        <nav id="nav"></nav>
        <div class="rail-foot">
          <div id="me" class="me"></div>
          <button id="logout" class="outline small" type="button">Sign out</button>
        </div>
      </aside>
      <main id="view" class="view"></main>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
