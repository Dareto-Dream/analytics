<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d10" />
    <title>DeltaVDevs status</title>
    <meta name="description" content="Whether each DeltaVDevs site is up, checked every minute, with 90 days of history." />
    <link rel="canonical" href="https://status.deltavdevs.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/status.css" />
    <script type="module" src="/status-app.js"></script>
  </head>
  <body>
    <main class="wrap">
      <header class="top">
        <h1>DeltaVDevs status</h1>
        <p id="summary" class="summary">Loading…</p>
        <p id="checked" class="muted"></p>
      </header>
      <div id="groups"></div>
      <section class="outages">
        <h2>Recent outages</h2>
        <div id="outages"><p class="muted">Loading…</p></div>
      </section>
      <footer class="muted">Every site is checked once a minute from our servers. A site counts as up when it answers with anything but a server error. <a href="/status.json">JSON</a></footer>
    </main>
  </body>
</html>
